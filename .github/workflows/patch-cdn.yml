name: Copy published patch to Battly CDN
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Published patch tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-24.04
    environment: battly-updates
    concurrency:
      group: battly-patch-cdn
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix "public scripts/cdn-publisher"
      - name: Check mirror publication
        run: node --test "public scripts/mirror-patch-release.test.cjs"
      - name: Copy and verify immutable patch files before updating discovery
        env:
          GH_TOKEN: ${{ github.token }}
          WASABI_ENDPOINT: ${{ secrets.BATTLY_CDN_ENDPOINT }}
          WASABI_REGION: ${{ secrets.BATTLY_CDN_REGION }}
          WASABI_BUCKET: ${{ secrets.BATTLY_CDN_BUCKET }}
          WASABI_KEY: ${{ secrets.BATTLY_CDN_KEY }}
          WASABI_SECRET: ${{ secrets.BATTLY_CDN_SECRET }}
          PATCH_TAG: ${{ inputs.tag }}
        run: node "public scripts/mirror-patch-release.cjs" "$PATCH_TAG"
