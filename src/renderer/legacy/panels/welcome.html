<div class="login-content welcome-flow">
  <section
    class="login-card welcome-card"
    id="bienvenido_1"
    aria-labelledby="welcome-title"
  >
    <p class="welcome-step-label">Primer inicio · 1 de 2</p>
    <h1
      class="store"
      id="welcome-title"
    >
      Tu Minecraft, en un solo lugar
    </h1>
    <p>
      Instala versiones, organiza instancias y entra a jugar sin perderte entre configuraciones.
    </p>
    <div
      class="welcome-brand-mark"
      aria-hidden="true"
    >
      <img
        src="assets/images/icons/battly.png"
        alt=""
      />
    </div>
    <div class="login-type">
      <button
        class="battly login-type-btn welcome-next"
        id="bienvenido_1_boton"
      >
        Configurar Battly
        <i
          class="fa-solid fa-arrow-right"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </section>

  <section
    class="login-card welcome-card welcome-login-choice"
    id="bienvenido_2"
    aria-labelledby="welcome-login-title"
  >
    <p class="welcome-step-label">Primer inicio · 2 de 2</p>
    <div class="card-body">
      <h1
        class="store"
        id="welcome-login-title"
      >
        Elige tu cuenta
      </h1>
      <p>Battly conserva el método original: cuenta Battly o cuenta oficial de Microsoft.</p>
      <div class="login-type welcome-login-types">
        <button
          class="battly login-type-btn"
          id="battly_login_btn"
        >
          <i
            class="fa-solid fa-user"
            aria-hidden="true"
          ></i>
          <span><strong>Battly</strong><small>Tu cuenta de Battly Launcher</small></span>
        </button>
        <button class="mojang login-type-btn">Mojang</button>
        <button class="microsoft login-type-btn">
          <i
            class="fa-brands fa-microsoft"
            aria-hidden="true"
          ></i>
          <span><strong>Microsoft</strong><small>Tu cuenta oficial de Minecraft</small></span>
        </button>
      </div>
      <button
        class="welcome-back"
        type="button"
        data-welcome-back
      >
        <i
          class="fa-solid fa-arrow-left"
          aria-hidden="true"
        ></i>
        Volver
      </button>
    </div>
  </section>
</div>
